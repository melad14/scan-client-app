name: dr_ray
description: Dr Ray - Home medical services app for patients.
version: 1.0.2+3
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^13.1.0
  dio: ^5.9.2
  socket_io_client: ^2.0.3+1
  shared_preferences: ^2.5.5
  flutter_map: ^6.2.1
  latlong2: ^0.9.1
  path_provider: ^2.1.6
  firebase_messaging: ^16.4.0
  firebase_core: ^4.11.0
  geolocator: ^14.0.3
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.0.1
  image_picker: ^1.0.7
  package_info_plus: ^10.2.2

flutter:
  uses-material-design: true
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"

flutter_native_splash:
  # Whole screen in the logo's own background colour so the logo blends in (no white frame).
  # Images are generated from assets/logo.png — see .agents skill notes (Splash).
  color: "#060F10"
  image: "assets/splash_logo.png"        # 1440px = ~360dp: fills the phone width
  android_12:
    # Android 12+ only allows a centred icon clipped to a circle; logo sits inside it
    image: "assets/splash_android12.png"
    color: "#060F10"
    icon_background_color: "#060F10"
